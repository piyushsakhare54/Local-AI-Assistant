[project]
name = "local-ai-conversation-assistant"
version = "0.1.0"
description = "Local-first real-time conversation assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "aiosqlite>=0.21,<1",
  "faster-whisper>=1.1,<2",
  "av>=19,<20",
  "httpx>=0.28,<1",
  "numpy>=1.23,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
